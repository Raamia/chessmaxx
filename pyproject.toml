[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chessmaxx"
version = "1.1.0"
description = "Evaluation and training infrastructure for a chess-playing language model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-chess>=1.999,<2",
]

[project.scripts]
chessmaxx-eval = "chessmaxx.evaluation.cli:main"
chessmaxx-data = "chessmaxx.training.cli:main"
chessmaxx-train = "chessmaxx.training.train_cli:main"
chessmaxx-memorize = "chessmaxx.training.memorize_cli:main"
chessmaxx-elo = "chessmaxx.tournament.cli:main"
chessmaxx-elo-compare = "chessmaxx.tournament.compare:main"

[project.optional-dependencies]
model = [
  "torch>=2.3",
  "transformers>=4.51",
]
train = [
  "torch>=2.3",
  "transformers>=4.51",
  "accelerate>=1.0",
  "peft>=0.18",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
